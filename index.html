<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Conversor de Moedas</title>
</head>

<body>

    <h1>Conversor de Moedas</h1>

    <label for="valor">Valor</label>
    <input type="number" id="valor" min="0" step="0.01" placeholder="Exemplo: 100">

    <label for="moeda-origem">De</label>
    <select id="moeda-origem">
        <option value="USD"> USD - Dólar Americano</option>
        <option value="EUR">EUR - Euro</option>
        <option value="BRL">BRL - Real Brasileiro</option>
    </select>

    <label for="moeda-destino">Para</label>
    <select id="moeda-destino">
        <option value="BRL">BRL - Real Brasileiro</option>
        <option value="EUR">EUR - Euro</option>
        <option value="USD"> USD - Dólar Americano</option>
    </select>

    <button type="button" id="botao-converter">Converter</button>

    <div id="resultado" aria-live="polite"></div>

    <script src="scripts.js"></script>
</body>

</html>
