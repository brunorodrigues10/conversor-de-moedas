<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Conversor de Moedas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @theme {
    --font-sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
  }
</style>

</head>

<body class="flex min-h-screen items-center justify-center bg-neutral-100 p-4 text-neutral-900">

    <main class="w-full max-w-md rounded-2xl bg-white p-6 shadow-sm ring-1 ring-neutral-200 sm:p-8">

        <h1 class="text-2xl font-bold tracking-tight">Conversor de Moedas</h1>
        <p class="mt-1 text-sm text-neutral-500"> Converta valores entre moedas com cotações atuais</p>

        <div class="mt-6 space-y-5">

            <div>
                <label for="valor" class="mb-1.5 block text-sm font-medium text-neutral-700">Valor</label>
                <input type="number" id="valor" min="0" step="0.01" placeholder="Exemplo: 100" class="w-full rounded-xl border border-neutral-300 bg-white px-4 
                    py-3 text-lg outline-none transition placeholder:text-neutral-400
                    focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10">
            </div>

            <div class="flex flex-col gap-3 sm:flex-row sm:items-end">

                <div class="min-w-0 sm:flex-1">
                    <label for="moeda-origem" class="mb-1.5 block text-sm font-medium text-neutral-700">De</label>
                    <select id="moeda-origem"
                        class="w-full rounded-xl border border-neutral-300 bg-white px-3 py-3 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"></select>
                </div>

                <button type="button" id="botao-inverter" aria-label="Inverter Moedas"
                    class="flex h-11 w-11 shrink-0 rotate-90 items-center justify-center self-center rounded-full border border-neutral-300 bg-white text-neutral-700 transition hover:bg-neutral-100 focus-visible:ring-2 focus-visible:ring-neutral-900 focus-visible:outline-none sm:self-end sm:rotate-0 mt-7">⇄</button>

                <div class="min-w-0 sm:flex-1">
                    <label for="moeda-destino" class="mb-1.5 block text-sm font-medium text-neutral-700">Para</label>
                    <select id="moeda-destino"
                        class="w-full rounded-xl border border-neutral-300 bg-white px-3 py-3 text-sm outline-none transition focus:border-neutral-900 focus:ring-2 focus:ring-neutral-900/10"></select>
                </div>

            </div>

            <button type="button" id="botao-converter"
                class="w-full rounded-xl bg-neutral-900 px-4 py-3.5 font-semibold text-white transition hover:bg-neutral-800 focus-visible:ring-2 focus-visible:ring-neutral-900 focus-visible:ring-offset-2 focus-visible:outline-none active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50">Converter</button>

            <div id="resultado" aria-live="polite"
                class="rounded-xl bg-neutral-50 p-4 text-center text-xl font-semibold tabular-nums empty:hidden"></div>
            <p id="data-cotacao" hidden class="text-center text-xs text-neutral-500"></p>

            <div id="area-grafico" hidden>
                <p id="titulo-grafico" class="mb-2 text-xs font-medium text-neutral-500"></p>
                <div class="relative h-48">
                    <canvas id="grafico"></canvas>
                </div>
            </div>

            <p id="mensagem-erro" role="alert" hidden
                class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></p>
            <p id="carregando" hidden class="text-center text-sm text-neutral-500">Buscando cotação...</p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
    <script src="scripts.js"></script>
</body>

</html>
